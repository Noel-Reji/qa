[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-qa-agent"
version = "0.1.0"
description = "Production-grade AI Agent for complex office document reasoning"
requires-python = ">=3.10"
dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Parsing
    "PyPDF2>=3.0.0",
    "pymupdf>=1.23.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.0.0",
    "pandas>=2.0.0",
    # LLM & Embedding
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "requests>=2.31.0",
    # Retrieval
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    # Database
    "sqlalchemy>=2.0.0",
    "duckdb>=0.9.0",
    # Graph & Reasoning
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.1",
    # Utilities
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "loguru>=0.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

ui = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
